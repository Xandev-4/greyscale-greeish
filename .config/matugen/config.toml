[config]
version_check = false

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty/colors.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi/yazi-theme.toml"
output_path = "~/.config/yazi/flavors/custom.yazi/flavor.toml"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "pkill -SIGUSR1 kitty"

[templates.rofi] 
input_path = "~/.config/matugen/templates/rofi/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.niri]
input_path = "~/.config/matugen/templates/niri/config.kdl"
output_path = "~/.config/niri/config.kdl"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel/fuzzel.ini"
output_path = "~/.config/fuzzel/colors.ini"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar/colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "~/.config/waybar/scripts/reload.sh"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'

[templates.pywalfox]
input_path = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[templates.swaync]
input_path = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/swaync/colors.css"
post_hook = "swaync-client -rs"

[templates.swayosd]
input_path = "~/.config/matugen/templates/swayosd/style.css"
output_path = "~/.config/swayosd/style.css"
post_hook = "pkill -9 swayosd-server; sleep 0.5; swayosd-server --style ~/.config/swayosd/style.css &"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qt/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.color-scheme]
input_path = "~/.config/matugen/templates/Matugen.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"

[templates.kdeglobals]
input_path = "~/.config/matugen/templates/kdeglobals/kdeglobals"
output_path = "~/.config/kdeglobals"

[templates.ags]
input_path = "~/.config/matugen/templates/ags/style.scss"
output_path = "~/.config/ags/style.scss"
