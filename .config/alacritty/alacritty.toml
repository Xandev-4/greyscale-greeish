[window]
opacity = 0.7
padding = { x = 22, y = 22 }
decorations = "Full"
dynamic_padding = false

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 800
blink_timeout = 0
unfocused_hollow = false

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

